services:
  postgres:
    image: postgres:16-alpine
    container_name: trackpill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackpill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - trackpill_postgres_data:/var/lib/postgresql/data
      - ./src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackpill"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trackpill_postgres_data:
